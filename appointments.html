<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Appointments | Home Doctor</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"></head>
<body>
<header class="header"><a class="logo" href="index.html"><i class="fa-solid fa-house-medical"></i><span>Home<span class="doctor">Doctor</span></span></a><div class="location"><i class="fa-solid fa-location-dot"></i><span>Healthcare<br><b>Anywhere in India</b></span></div><button class="header-btn" onclick="location.href='doctors.html'"><i class="fa-solid fa-user-doctor"></i><span>Doctors</span></button><button class="menu-btn" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></button></header>
<nav class="nav" id="navMenu"><a href="index.html">Home</a><a href="doctors.html">Doctors</a><a href="appointments.html">Appointments</a><a href="medicines.html">Medicines</a><a href="nearby.html">Nearby Care</a></nav>
<main class="page"><div class="page-title"><i class="fa-solid fa-calendar-check"></i><div><h1>Book an Appointment</h1><p>Select a doctor, consultation type and convenient time.</p></div></div>
<div class="two-col">
<section class="panel"><h2>Appointment Details</h2><form id="appointmentForm">
<label>Doctor<select id="doctorSelect" required></select></label>
<label>Consultation Type<select id="consultType"><option>Video Consultation</option><option>In-person Consultation</option><option>Phone Consultation</option></select></label>
<label>Date<input id="appointmentDate" type="date" required></label>
<label>Time<select id="appointmentTime" required><option>09:00 AM</option><option>10:00 AM</option><option>11:30 AM</option><option>02:00 PM</option><option>04:30 PM</option><option>06:00 PM</option></select></label>
<label>Reason / Symptoms<textarea id="reason" placeholder="Briefly describe the reason for consultation"></textarea></label>
<button class="primary-btn full" type="submit"><i class="fa-solid fa-calendar-plus"></i> Confirm Appointment</button>
</form></section>
<section class="panel"><h2>My Appointments</h2><div id="appointmentList" class="stack"></div></section>
</div></main><script src="script.js"></script></body></html>
